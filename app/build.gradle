apply plugin: 'com.android.application'
apply plugin: 'com.huawei.agconnect' // HUAWEI agconnect Gradle plugin

repositories {
    mavenLocal()
}


dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

//    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.1'
//    implementation 'com.android.support:appcompat-v7:28.0.0'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation "androidx.annotation:annotation:1.1.0"

    //权限
    implementation 'pub.devrel:easypermissions:3.0.0'

    implementation 'org.greenrobot:eventbus:3.2.0'

    implementation project(":push")
    api project(":base")
}

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "com.huawei.gspush"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        flavorDimensions "default"
        multiDexEnabled true

        // 为编译通过，先添加，后面删除
        //个推相关参数
        manifestPlaceholders = [
                //                GETUI_APP_ID    : "Rr51sROK4B8FXbq0TUjAF5",
                //                GETUI_APP_KEY   : "eurxTdqHECAKgc7s4xtUe9",
                //                GETUI_APP_SECRET: "wvAHiSQwuJ79Fp1tBy8Td8",
                GETUI_APP_ID    : "tHSXfYZwQR63CG5ZckhKu1",
                GETUI_APP_KEY   : "MgbBRw1xDp89sHbN3xGxE5",
                GETUI_APP_SECRET: "U75wIhRw9O9EJ0Ctaivu29",
                PACKAGE_NAME    : applicationId
        ]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    signingConfigs {
        config {
            keyAlias 'gsdemo'
            keyPassword '123456ab'
            storeFile file('../app.jks')
            storePassword '123456ab'
        }
        release {
            storeFile file('../app.jks')
            keyAlias 'gspush'
            keyPassword '123456ab'
            storePassword '123456ab'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}
