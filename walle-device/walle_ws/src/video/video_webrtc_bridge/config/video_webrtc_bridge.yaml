video_webrtc_bridge:
  ros__parameters:
    # 环境文件：用于读取 WHIP_SECRET / VIDEO_RTMP_URL_TEMPLATE（不覆盖已有环境变量）
    env_file: /etc/walle-ai.conf

    image_topic: /image_raw
    # 与 usb_cam 保持一致，使用 udev 固定路径 /dev/walle-camera
    camera_device: /dev/walle-camera
    framerate: 30.0
    room_number_pattern: "^[A-Za-z0-9_-]{1,64}$"

    # 推流地址模板与 secret 从 env_file 读取（VIDEO_RTMP_URL_TEMPLATE / WHIP_SECRET）。
    # 不要把 whip_secret 写进 YAML：ros2 param dump 会把明文打出来。
    # 需要覆盖时再取消下面两行注释：
    # rtmp_url_template: "rtmp://www.baidong.xyz:1935/live/{room}?secret={secret}"
    # whip_secret: "******"
    video_bitrate: "1000k"
    video_gop: 60
    video_preset: "ultrafast"

    # 麦克风混入：有可用录音源时自动带上音频
    audio_enable: true
    audio_device: "default"
    audio_codec: "aac"
    audio_bitrate: "128k"
    audio_fragment_size: 1024
    audio_probe_timeout: 3.0

    startup_grace: 3.0
    first_frame_timeout: 3.0

    # ffmpeg 日志目录，留空则用 ~/.ros/log/video_webrtc_bridge
    log_dir: ""
    log_max_bytes: 20971520

    # net_mqtt_bridge 心跳：丢失超过该时间自动停流，避免 MQTT 网关退出后留下孤儿推流
    heartbeat_topic: /net_mqtt_bridge/heartbeat
    heartbeat_timeout: 5.0
