video_webrtc_bridge:
  ros__parameters:
    # 环境文件：用于读取 MEDIA_SERVER_HOST / MEDIA_SERVER_SECRET（不覆盖已有环境变量）
    env_file: /etc/walle-ai.conf

    image_topic: /image_raw
    # 以下采集参数由 bringup 从 scripts/etc/walle_camera.conf 注入；
    # 这里的值只在单独启动 video_webrtc_bridge.launch.py 时生效。
    camera_device: /dev/video0
    # camera_format: MJPG | YUYV
    camera_format: MJPG
    # camera_owner=true：本节点独占摄像头（MJPG 硬解 + 硬件 H.264 编码），
    # 并发布 /image_raw；bringup 会自动检测并跳过 usb_cam。
    camera_owner: false
    camera_width: 640
    camera_height: 480
    # /image_raw 目标帧率（仅 camera_owner）；在 RGB 转换前抽样降频，
    # 推流分支仍按 framerate 全帧率编码。
    ros_image_fps: 10.0
    # 非空时从 walle_camera 的 shmsink 读取 H.264（camera_backend=shm）
    shm_socket: ""
    framerate: 30.0
    room_number_pattern: "^[A-Za-z0-9_-]{1,64}$"

    # 媒体服务器地址与推流 secret 从 env_file 读取（MEDIA_SERVER_HOST / MEDIA_SERVER_SECRET）。
    # 推流地址由协议固定：rtmp://{host}:1935/live/{room}?secret={secret}，无需配置模板。
    # 不要把 secret 写进 YAML：ros2 param dump 会把明文打出来。
    # 码率：640x480 建议 1000k；720p 建议 1500k~2500k；1080p 建议 3000k~4000k
    video_bitrate: "1000k"
    video_gop: 30
    video_preset: "ultrafast"
    # H.264 编码器：auto=优先 Rockchip MPP 硬件（mpph264enc，RK3588 等），
    # 其次 V4L2 M2M（h264_v4l2m2m），不可用自动回退 libx264；
    # 也可强制 mpph264enc / h264_v4l2m2m / libx264。
    video_encoder: "auto"

    # 麦克风混入：有可用录音源时自动带上音频
    audio_enable: true
    audio_device: "default"
    audio_codec: "aac"
    audio_bitrate: "128k"
    audio_fragment_size: 1024
    audio_probe_timeout: 3.0

    startup_grace: 3.0
    first_frame_timeout: 3.0

    # ffmpeg 日志目录，留空则用 ~/.ros/log/video_webrtc_bridge
    log_dir: ""
    log_max_bytes: 20971520
    # 历史日志保留：7 天 / 最多 10 个文件 / 总大小 100MB，优先删最旧的
    log_retention_days: 7.0
    log_max_files: 10
    log_max_total_bytes: 104857600

    # net_mqtt_bridge 心跳：丢失超过该时间自动停流，避免 MQTT 网关退出后留下孤儿推流
    heartbeat_topic: /net_mqtt_bridge/heartbeat
    heartbeat_timeout: 5.0
