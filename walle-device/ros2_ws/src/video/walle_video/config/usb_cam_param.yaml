/**:
    ros__parameters:
      # 摄像头设备节点，按实际设备修改：ls /dev/video* 或 v4l2-ctl --list-devices
      video_device: "/dev/video0"
      framerate: 30.0
      io_method: "mmap"
      frame_id: "camera"
      pixel_format: "mjpeg2rgb"  # see usb_cam/supported_formats for list of supported formats
      av_device_format: "YUV422P"
      image_width: 640
      image_height: 480
      camera_name: "usb_cam"
      camera_info_url: "package://walle_video/config/camera_info.yaml"
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      # 该 UVC 相机在 kernel 6.8 下的控制名已变为 white_balance_automatic /
      # auto_exposure / focus_automatic_continuous，usb_cam 0.8.1 仍按旧名
      # （white_balance_temperature_auto / exposure_auto / focus_auto）设置，
      # 启动时会打印 3 条 "unknown control" 告警（已知、非致命，画面正常）。
      # 自动模式由 usb_cam.launch.py 里的 v4l2-ctl 按新名称设置。
      auto_white_balance: true
      autoexposure: true
      autofocus: true

