name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 架构守卫：分层约束一旦被破坏就在 CI 里失败（比 code review 可靠）
      - name: Architecture guard
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          # 1) 只有 ViewModel 允许监听 MQTT；页面（Fragment/Activity）必须走 ViewModel
          if grep -rn "implements .*MqttManager.Listener" app/src/main/java | grep -v "ViewModel.java"; then
            fail "页面不应实现 MqttManager.Listener，请改为 ViewModel + LiveData（见 N2）"
          fi

          # 2) LiveData 写入集中在 ViewModel，页面只 observe
          if grep -rn "\.setValue(\|\.postValue(" app/src/main/java | grep -v "ViewModel.java"; then
            fail "LiveData 写入应集中在 ViewModel，页面只允许 observe"
          fi

          # 3) WhepSession 的回调必须经 dispatch() 切主线程 + 捕获异常，
          #    否则异常跨 JNI 边界会直接 SIGABRT（signaling 线程）
          grep -q "private void dispatch(Runnable" app/src/main/java/www/walle/ai/ui/WhepSession.java \
            || fail "WhepSession 的 dispatch() 兜底被删除：WebRTC 回调必须切主线程且不得抛出异常"

          echo "架构守卫通过"

      # 单元测试：TopicNames / DeviceInfo 的主题与标识契约
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # 编译 debug APK（顺带验证 R8 未开启时的资源/清单/Java 编译链路）
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 设备端：主题契约自检 + 部署脚本语法检查（不需要树莓派）
      - name: Device contract self-test
        run: |
          python3 device/selftest_topics.py
          bash -n device/install.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
