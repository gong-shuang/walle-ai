# Gradle / AndroidX 配置
# 说明：依赖仓库已在 settings.gradle 与 build.gradle 中优先配置阿里云镜像，
#       国内网络也能快速构建；镜像不可用时自动回退 google()/mavenCentral()。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# ==========================================================================
# 注意：下面的每一项都是要修改成自己服务器配置的值，当前值仅用于演示
# ==========================================================================

# ---- MQTT 默认连接参数（仅主机/端口；账号密码在 App 内输入并加密保存）----
mqttHost=www.baidong.xyz
mqttPort=8883

# ---- 播放 / 拉流地址（演示服务器，调试时按需改）----
whepUrlTemplate=https://www.baidong.xyz:443/rtc/v1/whep/?app=live&stream={room}
# WHIP 推流鉴权 secret（每台服务器部署时生成）----
whipSecret=xxxxx
# WHIP 音频上行基础地址（{room} 为房间号占位符；oryxSecret 非空时会自动拼接 &whipSecret=）
whipAudioBaseUrl=https://www.baidong.xyz:443/rtc/v1/whip/?app=live&stream={room}_audio




