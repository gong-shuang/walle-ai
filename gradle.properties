# Gradle / AndroidX 配置
# 说明：依赖仓库已在 settings.gradle 与 build.gradle 中优先配置阿里云镜像，
#       国内网络也能快速构建；镜像不可用时自动回退 google()/mavenCentral()。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# ==========================================================================
# 下面的每一项都是「app/build.gradle 优先读这里 → 环境变量 → 内置默认值」，
# 所以删掉某行不会导致构建失败，并配置为实际项目的值。
# ==========================================================================

# ---- MQTT 默认连接参数（仅主机/端口；账号密码在 App 内输入并加密保存）----
mqttHost=www.abcde.xyz
mqttPort=8883

# ---- 播放 / 拉流地址（演示服务器，调试时按需改）----
whepUrlTemplate=https://www.abcde.xyz:443/rtc/v1/whep/?app=live&stream={room}
# WHIP 推流鉴权 secret（每台服务器部署时生成）----
whipSecret=xxxxxxxxxxx
# WHIP 音频上行基础地址（{room} 为房间号占位符；oryxSecret 非空时会自动拼接 &whipSecret=）
whipAudioBaseUrl=https://www.abcde.xyz:443/rtc/v1/whip/?app=live&stream={room}_audio




